<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="پست‌یار — وب‌اپلیکیشن تولید محتوای حرفه‌ای اینستاگرام" />
    <meta name="theme-color" content="#0f2f2c" />
    <script>
      try {
        var theme = localStorage.getItem('postyar_theme')
        var lang = localStorage.getItem('postyar_lang')
        if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme
        else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.dataset.theme = 'dark'
        }
        if (lang === 'en') {
          document.documentElement.lang = 'en'
          document.documentElement.dir = 'ltr'
        }
      } catch (e) {}
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="پست‌یار" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
    <title>پست‌یار | وب‌اپ محتوای اینستاگرام</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          for (const reg of regs) void reg.unregister()
        })
      }
      if ('caches' in window) {
        caches.keys().then((keys) => {
          for (const key of keys) void caches.delete(key)
        })
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
