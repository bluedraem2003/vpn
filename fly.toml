# fly.toml app configuration file generated for PostYar
# See https://fly.io/docs/reference/configuration/

app = 'postyar'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  HOST = '0.0.0.0'
  DATABASE_PATH = '/data/postyar.sqlite'
  SHARE_INVITE_LINKS = '1'
  ALLOW_DEV_LOGIN = '0'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  interval = '30s'
  timeout = '5s'
  grace_period = '20s'
  method = 'GET'
  path = '/api/health'

[[mounts]]
  source = 'postyar_data'
  destination = '/data'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
