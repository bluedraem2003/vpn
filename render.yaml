# One-click style deploy on Render: connect this repo and create a Web Service from this blueprint.
services:
  - type: web
    name: postyar
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /data/postyar.sqlite
      - key: SHARE_INVITE_LINKS
        value: "1"
      - key: ALLOW_DEV_LOGIN
        value: "0"
      - key: AUTH_PUBLIC_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_API_BASE
        value: https://api.telegram.org
    disk:
      name: postyar-data
      mountPath: /data
      sizeGB: 1
